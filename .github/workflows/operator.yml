name: operator

# Runs the Operator agent on a free ubuntu-latest runner for up to 6 hours,
# tunnels it via cloudflared, and publishes the public URL into Supabase so
# the phone UI can find it.

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep the session up (max 350)."
        required: false
        default: "350"

concurrency:
  group: operator-session
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GH hard cap is 360; leave a small buffer
    env:
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}
      MISTRAL_CODE_MODEL: ${{ secrets.MISTRAL_CODE_MODEL }}
      MOONDREAM_QUANT: ${{ secrets.MOONDREAM_QUANT }}
      PYTHONUNBUFFERED: "1"
      HF_HOME: ${{ github.workspace }}/.cache/hf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: operator/requirements.txt

      - name: System deps for Camoufox / Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 libxt6 libxcomposite1 \
            libxdamage1 libxrandr2 libpangocairo-1.0-0 libasound2t64 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libnss3 libxss1 fonts-liberation \
            wget ca-certificates

      - name: Install Python deps
        working-directory: operator
        run: pip install -r requirements.txt

      - name: Cache Camoufox Firefox build
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-v1

      - name: Fetch Camoufox Firefox
        run: python -m camoufox fetch

      - name: Cache Moondream weights
        uses: actions/cache@v4
        with:
          path: .cache/hf
          key: moondream2-${{ runner.os }}-v1

      - name: Download Moondream weights (if not cached)
        working-directory: operator
        run: python scripts/download_moondream.py

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Start Operator server
        working-directory: operator
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 7860 \
            > "${GITHUB_WORKSPACE}/operator.log" 2>&1 &
          echo $! > "${GITHUB_WORKSPACE}/operator.pid"

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7860/ > /dev/null; then
              echo "server up"; exit 0
            fi
            sleep 2
          done
          echo "server never came up"
          tail -n 200 "${GITHUB_WORKSPACE}/operator.log" || true
          exit 1

      - name: Start cloudflared quick tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:7860 \
            > "${GITHUB_WORKSPACE}/cloudflared.log" 2>&1 &
          echo $! > "${GITHUB_WORKSPACE}/cloudflared.pid"

      - name: Capture tunnel URL
        id: tunnel
        run: |
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              "${GITHUB_WORKSPACE}/cloudflared.log" | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Tunnel: $URL"
              exit 0
            fi
            sleep 2
          done
          echo "no tunnel URL found"
          cat "${GITHUB_WORKSPACE}/cloudflared.log" || true
          exit 1

      - name: Publish endpoint to Supabase
        working-directory: operator
        env:
          OPERATOR_PUBLIC_URL: ${{ steps.tunnel.outputs.url }}
          OPERATOR_RUN_ID: ${{ github.run_id }}
          OPERATOR_DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: python scripts/publish_endpoint.py

      - name: Keep alive for requested duration
        env:
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          MINUTES=${DURATION:-350}
          if [ "$MINUTES" -gt 350 ]; then MINUTES=350; fi
          echo "Holding session open for $MINUTES minutes"
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! kill -0 "$(cat "${GITHUB_WORKSPACE}/operator.pid")" 2>/dev/null; then
              echo "operator process died"
              tail -n 200 "${GITHUB_WORKSPACE}/operator.log" || true
              exit 1
            fi
            sleep 30
          done

      - name: Clear endpoint in Supabase
        if: always()
        working-directory: operator
        env:
          OPERATOR_PUBLIC_URL: ""
          OPERATOR_RUN_ID: ${{ github.run_id }}
        run: python scripts/publish_endpoint.py || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-logs-${{ github.run_id }}
          path: |
            operator.log
            cloudflared.log
